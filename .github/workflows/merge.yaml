name: Merge Workflow

on:
  push:
    branches:
      - build_overhaul

jobs:
  tag-commit:
    uses: ryanmrichard/.github/.github/workflows/tag.yaml@master
    secrets: inherit

  deploy_nwx_docs:
    uses: ryanmrichard/.github/.github/workflows/deploy_nwx_docs.yaml@master
    with:
      doc_target: "chemcache_cxx_api"
      generate_module_docs: true
    secrets: inherit

  platform_matrix:
    uses: ryanmrichard/.github/.github/workflows/platform_matrix.yaml@master

  build_pypi_dist:
    needs: [tag-commit, platform_matrix]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.platform_matrix.outputs.release_matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Build PyPI Distribution
        uses: ryanmrichard/.github/.github/actions/build_pypi_dist@master
        with:
          cibw_build: ${{ matrix.cibw_build }}
          build_sdist: ${{ matrix.os == 'ubuntu-latest' && 'true' || 'false' }}
          extra_index_url: https://test.pypi.org/simple/
          needs_mpi: "true"
          needs_boost: "true"

      - name: Upload Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/

  # A separate, ubuntu-only publish job (rather than a publish step per
  # build_pypi_dist leg) because pypa/gh-action-pypi-publish only runs on
  # Linux, and because PyPI trusted publishing does not support reusable
  # workflows (this job must be defined directly here, not delegated).
  deploy_to_pypi:
    needs: build_pypi_dist
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download All Distributions
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/

  download-and-generate-reference-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: fregante/setup-git-user@v1
      - uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Install venv and dependencies
        run: |
          python -m venv venv
          . venv/bin/activate
          pip install -r requirements.txt
        shell: bash
      - name: Overwrite 'generated_data' with 'build_overhaul'
        run: |
          git fetch
          git checkout --track origin/generated_data
          git checkout build_overhaul
          git merge -s ours generated_data -m "Merge branch 'generated_data'" --allow-unrelated-histories
          git checkout generated_data
          git merge build_overhaul -m "Merge build_overhaul -> generated_data"
        shell: bash
      - name: Download reference data
        run: .github/workflows/scripts/download_reference_data.sh
      - name: Generate reference data source code
        run: .github/workflows/scripts/generate_reference_data.sh
      - name: Format generated code
        run: find src/ -iname '*.cpp' | xargs clang-format --verbose -i
      - name: Commit and push changes to data branch
        uses: github-actions-x/commit@v2.9
        with:
          push-branch: generated_data
          commit-message: Automatically updated reference data using GitHub Actions
